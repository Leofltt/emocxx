name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: emocxx
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: emocxx
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: emocxx
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: emocxx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin emocxx --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="nightly"
          fi
          ARCHIVE_DIR="emocxx-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}/cmake"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${ARCHIVE_DIR}/"
          cp "cmake/emocxx-toolchain.cmake" "${ARCHIVE_DIR}/cmake/"
          cp README.md "${ARCHIVE_DIR}/"
          
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          shasum -a 256 "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            emocxx-*.tar.gz
            emocxx-*.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/emocxx-*.tar.gz
            artifacts/emocxx-*.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

