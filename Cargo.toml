[package]
name = "emocxx"
version = "0.1.0"
edition = "2021"
authors = ["Open Source Systems Architecture"]
description = "Transparent C++ compiler proxy transpiling Unicode emoji identifiers to valid C++ ASCII tokens"
license = "CC0-1.0"

[dependencies]
unicode-segmentation = "1.12.0"

[[bin]]
name = "emocxx"
path = "src/main.rs"

[[bin]]
name = "bench_lexer"
path = "benchmarks/micro/lexer_throughput.rs"

[dev-dependencies]

